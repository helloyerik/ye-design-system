<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><title>yetemplate</title>
<style>
:root{--bg:#fff;--fg:#000;--dim:rgba(0,0,0,.6);--line:rgba(0,0,0,.14);--tone:rgba(0,0,0,.05);--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.6);--line:rgba(255,255,255,.12);--tone:rgba(255,255,255,.08);--err:#ff8a80}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:400 15px/1.45 system-ui,sans-serif}
main{box-sizing:border-box;min-height:100%;max-width:480px;margin:0 auto;padding:calc(48px + var(--ye-inset-top,0px)) 24px calc(24px + var(--ye-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;font-weight:600;margin:0}p{margin:0;color:var(--dim);font-size:13px}
input{box-sizing:border-box;width:100%;height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--tone);color:var(--fg);font:inherit}
input:focus{outline:2px solid var(--fg);outline-offset:1px}
button{height:48px;border-radius:24px;border:0;background:var(--fg);color:var(--bg);font:600 15px system-ui,sans-serif}
.err{color:var(--err)}
</style></head><body><main>
<h1>yetemplate</h1>
<p>Enter your yetemplate server address, for example <b>http://t470:PORT</b> (your Tailscale name).</p>
<form id="f"><input id="u" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="http://t470:PORT" required></form>
<p id="e" class="err" hidden></p>
<button form="f" type="submit">Connect</button>
<p>You can change it later: long-press the yetemplate icon → Server address.</p>
</main><script>
const q=new URLSearchParams(location.search),u=document.getElementById('u'),e=document.getElementById('e')
u.value=(window.YeSetup&&YeSetup.current())||''
if(q.get('err')){e.hidden=false;e.textContent='Could not reach '+(q.get('url')||'the server')+': '+q.get('err')}
document.getElementById('f').onsubmit=(ev)=>{ev.preventDefault();let v=u.value.trim();if(!/^https?:\/\//i.test(v))v='http://'+v
try{new URL(v)}catch{e.hidden=false;e.textContent='That does not look like an address';return}YeSetup.save(v)}
</script></body></html>
